<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdForge AI — Creative Studio</title><link rel="stylesheet" href="/theme.css"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script></head>
<body x-data="studio()" x-init="init()" class="min-h-screen">
<div class="min-h-screen lg:flex">
<aside class="hidden lg:flex w-64 shrink-0 border-r border-gray-200 bg-white/80 flex-col p-5 sticky top-0 h-screen">
  <a href="/" class="brand text-xl font-bold px-2 mb-9">AdForge<span class="text-violet-600">.</span></a>
  <div class="text-[10px] uppercase tracking-widest text-gray-400 font-bold px-3 mb-2">Workspace</div>
  <a class="sidebar-link active" href="/app.html">✦ <span>Creative Studio</span></a>
  <a class="sidebar-link" href="#library" @click.prevent="view='library'">▦ <span>Creative Library</span></a>
  <div class="mt-auto border-t border-gray-100 pt-4"><button class="sidebar-link w-full" @click="signOut()">↪ <span>Sign out</span></button></div>
</aside>
<main class="flex-1 min-w-0">
<header class="h-16 border-b border-gray-200 bg-white/80 backdrop-blur flex items-center justify-between px-5 md:px-8 sticky top-0 z-20">
  <div><div class="text-xs text-gray-400">Workspace</div><div class="font-bold">Creative Studio</div></div>
  <div class="flex items-center gap-3"><span class="hidden sm:inline text-xs text-gray-500" x-text="userEmail"></span><a href="/" class="text-sm font-semibold text-gray-600">Home</a></div>
</header>
<div class="max-w-7xl mx-auto p-5 md:p-8">
  <template x-if="view==='studio'">
  <div class="grid xl:grid-cols-[410px_1fr] gap-7">
    <section class="card p-6 h-fit">
      <div class="flex items-start justify-between"><div><h1 class="text-2xl font-bold">Create an ad</h1><p class="text-sm text-gray-500 mt-1">Give the model a clear brief.</p></div><span class="chip">AI</span></div>
      <form class="mt-6 space-y-4" @submit.prevent="generate()">
        <div><label class="label">Product or offer</label><textarea class="field min-h-24 resize-y" x-model="form.product" placeholder="e.g. Handmade sandalwood perfume with a warm, woody scent"></textarea></div>
        <div><label class="label">Target audience</label><textarea class="field min-h-20 resize-y" x-model="form.audience" placeholder="e.g. 22–35, design-conscious shoppers who prefer distinctive fragrance"></textarea></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="label">Platform</label><select class="field" x-model="form.platform"><option>Instagram</option><option>Facebook</option><option>TikTok</option><option>Google Ads</option><option>LinkedIn</option></select></div><div><label class="label">Objective</label><select class="field" x-model="form.objective"><option>Conversions</option><option>Awareness</option><option>Engagement</option><option>Traffic</option><option>Leads</option></select></div></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="label">Tone</label><select class="field" x-model="form.tone"><option>Bold & modern</option><option>Premium & elegant</option><option>Playful & energetic</option><option>Warm & authentic</option><option>Minimal & direct</option></select></div><div><label class="label">Visual style</label><select class="field" x-model="form.visualStyle"><option>Premium studio</option><option>Editorial lifestyle</option><option>Bold product close-up</option><option>UGC-inspired</option><option>Minimal graphic</option></select></div></div>
        <button class="btn violet w-full py-3" :disabled="loading" x-text="loading?'Generating creative…':'Generate creative →'"></button>
        <p x-show="error" x-text="error" class="text-sm text-red-600"></p>
      </form>
    </section>
    <section>
      <div class="flex items-end justify-between mb-4"><div><div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Live output</div><h2 class="text-2xl font-bold mt-1">Your creative</h2></div><button x-show="creative" @click="copyCreative()" class="btn bg-white border border-gray-200 text-sm">Copy copy</button></div>
      <template x-if="!creative && !loading"><div class="card min-h-[560px] flex items-center justify-center text-center p-8"><div><div class="w-14 h-14 rounded-2xl bg-[#f0edff] text-violet-600 grid place-items-center mx-auto text-2xl">✦</div><h3 class="text-xl font-bold mt-5">Your ad will appear here</h3><p class="text-gray-500 mt-2 max-w-sm">Complete the brief and generate a campaign-ready concept. Your result will also be saved to the library.</p></div></div></template>
      <template x-if="loading"><div class="card min-h-[560px] p-7 animate-pulse"><div class="h-72 rounded-2xl bg-gray-100"></div><div class="h-7 bg-gray-100 rounded mt-6 w-3/4"></div><div class="h-4 bg-gray-100 rounded mt-3 w-full"></div><div class="h-4 bg-gray-100 rounded mt-2 w-5/6"></div></div></template>
      <template x-if="creative && !loading"><div class="card overflow-hidden">
        <div class="poster p-8 md:p-10 flex flex-col justify-between min-h-[300px]"><div class="relative z-10 flex justify-between text-white text-xs"><span class="bg-black/20 backdrop-blur rounded-full px-3 py-1.5" x-text="creative.platform"></span><span class="bg-white/15 backdrop-blur rounded-full px-3 py-1.5" x-text="creative.visual_style"></span></div><div class="relative z-10 max-w-xl text-white"><div class="text-xs uppercase tracking-[.22em] text-white/65 mb-3">Creative direction</div><div class="text-4xl md:text-5xl font-bold leading-[.95]" x-text="creative.headline"></div><p class="mt-4 text-white/75 max-w-lg" x-text="creative.concept"></p></div></div>
        <div class="p-7 md:p-9"><div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Primary text</div><p class="mt-3 text-lg leading-relaxed" x-text="creative.primary_text"></p><div class="mt-7 flex items-center justify-between gap-4"><div><div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Call to action</div><div class="font-bold mt-1" x-text="creative.call_to_action"></div></div><button @click="generate()" class="btn primary">Generate another</button></div></div>
      </div></template>
    </section>
  </div>
  </template>
  <template x-if="view==='library'">
    <section id="library"><div class="flex items-end justify-between mb-7"><div><div class="text-xs uppercase tracking-widest text-gray-400 font-bold">Workspace</div><h1 class="text-3xl font-bold mt-1">Creative Library</h1></div><button @click="view='studio'" class="btn violet">+ New creative</button></div>
      <template x-if="!history.length"><div class="card p-12 text-center text-gray-500">No saved creatives yet.</div></template>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"><template x-for="item in history" :key="item.id"><article class="card overflow-hidden"><div class="poster p-5 min-h-[180px] flex flex-col justify-end"><span class="relative z-10 text-white text-xs uppercase tracking-widest" x-text="item.platform"></span><h3 class="relative z-10 text-white text-2xl font-bold mt-2" x-text="item.headline"></h3></div><div class="p-5"><div class="text-xs text-gray-400" x-text="item.product_name"></div><p class="text-sm text-gray-600 mt-2 line-clamp-3" x-text="item.primary_text"></p><button class="mt-4 text-sm font-bold text-violet-600" @click="creative=item;view='studio'">Open creative →</button></div></article></template></div>
    </section>
  </template>
</div>
</main></div>
<script src="/app.js"></script></body></html>
